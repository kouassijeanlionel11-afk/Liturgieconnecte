<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liturgieconnecté</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#faf6f1;--card:#fff;--ink:#2b1d12;--mut:#7d6a5a;--pri:#7a3e12;--pri2:#a5601f;--line:#e6d9cb;--chip:#f3e5d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1510;--card:#271d15;--ink:#f3e8dc;--mut:#b09a86;--pri:#d98c4a;--pri2:#e6a468;--line:#3d2f23;--chip:#3a2a1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1510;--card:#271d15;--ink:#f3e8dc;--mut:#b09a86;--pri:#d98c4a;--pri2:#e6a468;--line:#3d2f23;--chip:#3a2a1c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header img{width:52px;height:52px;border-radius:50%}
h1{font:700 20px Georgia,serif;margin:0;color:var(--pri)}
header small{color:var(--mut)}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:860px;margin:0 auto;padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .t{flex:1;font-weight:600;min-width:160px}
button.p{background:var(--pri);color:#fff;border:0;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600}
button.s{background:var(--chip);color:var(--ink);border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
button.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-width:100%}
.day h3{margin:0 0 8px;font:600 16px Georgia,serif;color:var(--pri);text-transform:capitalize}
.svc{border-top:1px dashed var(--line);padding:10px 0}
.svc .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.svc .lbl{flex:1;min-width:180px}
.tm{font-weight:600;color:var(--pri)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{background:var(--chip);border-radius:16px;padding:3px 6px 3px 10px;display:inline-flex;gap:4px;align-items:center}
details{margin-top:6px;color:var(--mut)}
details summary{cursor:pointer}
.empty{color:var(--mut);text-align:center;padding:18px}
.postes[hidden]{display:none}
.hint{display:block;color:var(--mut);margin:2px 0 6px}
.meter{height:6px;background:var(--chip);border-radius:3px;margin-top:6px}.meter i{display:block;height:100%;background:var(--pri);border-radius:3px;transition:width .6s}
button{transition:transform .12s,background .2s,box-shadow .2s}button:active{transform:scale(.95)}
button.p,button.s{position:relative;overflow:hidden}button.p:hover{box-shadow:0 4px 12px rgba(122,62,18,.3)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .5s linear;pointer-events:none}@keyframes rp{to{transform:scale(3);opacity:0}}
input,select{transition:border-color .2s,box-shadow .2s,transform .2s}
input:focus,select:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent);transform:translateY(-1px)}
.chip{animation:pop .25s both}.cd{transition:transform .15s,background .2s}.cd:hover{transform:scale(1.05)}
main.fx>*{animation:pop .35s ease both}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
#welcome{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:radial-gradient(circle at 50% 30%,var(--chip),var(--bg));transition:opacity .5s,transform .5s}
#welcome.out{opacity:0;transform:scale(1.05);pointer-events:none}
#welcome img{width:130px;height:130px;border-radius:50%;animation:float 3s ease-in-out infinite;box-shadow:0 10px 30px rgba(122,62,18,.25)}@keyframes float{50%{transform:translateY(-8px)}}
#welcome h2{font:700 30px Georgia,serif;color:var(--pri);margin:8px 0 0}#welcome p{margin:0;color:var(--mut)}
#welcome button{margin-top:16px;font-size:17px;padding:12px 32px;border-radius:30px}
#cur{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid var(--pri);border-radius:50%;pointer-events:none;z-index:200;opacity:0;transition:width .2s,height .2s,margin .2s,background .2s,opacity .3s}
#cur::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--pri)}
#cur.big{width:56px;height:56px;margin:-28px 0 0 -28px;background:color-mix(in srgb,var(--pri) 18%,transparent)}
#cur.down{width:22px;height:22px;margin:-11px 0 0 -11px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hero{text-align:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0}.hero small{opacity:.9}.hero h3{margin:4px 0;font:700 22px Georgia,serif}
.big{font:700 32px/1.2 Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
.badge{background:var(--chip);color:var(--pri);font-weight:700;border-radius:14px;padding:3px 10px}
.nf{max-width:860px;margin:0 auto;padding:0 16px 8px}
#nextf{display:block;width:100%;background:var(--chip);color:var(--ink);border:0;padding:8px 12px;border-radius:10px;cursor:pointer;font:600 14px inherit;text-align:left;font-variant-numeric:tabular-nums}#nextf:empty{display:none}
#login{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;background:var(--bg)}#login[hidden]{display:none}
#login input{width:260px}#lerr{color:#c0392b;min-height:1.2em;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{text-align:center;color:var(--mut);font-weight:600;font-size:13px}
.cd{min-height:58px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:5px 6px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;cursor:pointer;font:inherit}
.cd span{font-size:11px;color:var(--mut)}.cd.o{opacity:.4}.cd.t{border-color:var(--pri);border-width:2px}.cd.w{background:var(--chip)}
.postes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}.poste{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}.pl{display:flex;gap:6px;align-items:center;margin-bottom:4px}.pl small{color:var(--mut)}.cap{width:52px;margin-left:auto;padding:2px 4px}
.days label{margin-right:8px;display:inline-block}
</style>
</head>

function services(d){
  const k=fmt(d);
  const a=S.masses.filter(m=>m.days.includes(d.getDay())).map(m=>({key:k+'|'+m.id,label:S.labels[k+'|'+m.id]??m.label,time:m.time,sp:false,pos:m.postes??!m.days.every(j=>j>=1&&j<=5)}));
  const b=(S.specials[k]||[]).map(m=>({key:k+'|'+m.id,label:S.labels[k+'|'+m.id]??m.label,time:m.time,sp:true,id:m.id,date:k,pos:m.postes??true}));
  return a.concat(b).sort((x,y)=>x.time.localeCompare(y.time));
}
function renderNav(){
  const T=[['plan','Programmation'],['cal','Calendrier'],['feasts','Fêtes'],['servants','Servants'],['masses','Messes par défaut'],['stats','Statistiques'],['data','Sauvegarde']];

function renderPlan(){
  const end=addDays(ws,6);
  let h=`<div class="bar"><button class="s" data-wk="-1">←</button><div class="t">Semaine du ${long(ws)} au ${long(end)}</div><button class="s" data-wk="1">→</button><button class="s" data-wk="0">Aujourd’hui</button><input type="date" id="goto" value="${fmt(ws)}" aria-label="Aller à une date"><button class="p" data-pdf="w">PDF de la semaine</button><button class="s" data-dup>Copier la semaine précédente</button><button class="s" data-wa>WhatsApp</button></div>`;
  for(let i=0;i<7;i++){
    const d=addDays(ws,i),k=fmt(d),sv=services(d);
    h+=`<div class="card day"><h3>${long(d)}</h3>`;
    h+=sv.length?sv.map(s=>{
      const used=Object.values(S.assign[s.key]||{}).flat();const opts=S.servants.filter(n=>!used.includes(n));
      return `<div class="svc"><div class="row">
        <input class="lbl" data-lbl="${s.key}" value="${esc(s.label)}" placeholder="Précisez la messe" aria-label="Intitulé de la messe">
        ${s.sp?`<input type="time" class="tm" data-sptime="${s.date}|${s.id}" value="${s.time}">`:`<span class="tm">${hm(s.time)}</span>`}
        ${s.sp?`<button class="x" title="Supprimer cette messe spéciale" data-delsp="${s.date}|${s.id}">🗑</button>`:''}</div>
        ${!s.pos?simple(s,opts):''}${s.pos?'<small class="hint">Choisissez le nombre de servants pour chaque poste de cette messe ↓</small>':''}<div class="postes"${!s.pos?' hidden':''}>${POSTES.map(p=>{const as=get(s.key,p[0]),c=cap(s.key,p);return `<div class="poste"><div class="pl"><b>${p[1]}</b> <small>${as.length}/${c}</small><input type="number" min="0" max="8" class="cap" data-cap="${s.key}~${p[0]}" value="${c}" title="Nombre de places"></div><div class="chips">${as.map(n=>`<span class="chip">${esc(n)}<button class="x" data-rm="${s.key}~${p[0]}~${esc(n)}" aria-label="Retirer">×</button></span>`).join('')}${as.length<c?`<select data-add="${s.key}~${p[0]}"><option value="">+ Ajouter</option>${opts.map(n=>`<option>${esc(n)}</option>`).join('')}</select>`:''}</div></div>`}).join('')}</div></div>`}).join(''):'<div class="empty">Aucune messe ce jour.</div>';
    h+=`<details><summary>+ Ajouter une messe spéciale</summary><div class="row" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><input id="sl-${k}" placeholder="Ex. : Messe de la fête patronale"><input type="time" id="st-${k}" value="10:00"><label><input type="checkbox" id="sp-${k}" checked> Avec postes</label><button class="s" data-addsp="${k}">Ajouter</button></div></details></div>`;
  }
  app.innerHTML=h;
}
function renderServants(){
  app.innerHTML=`<div class="card"><div class="bar"><input id="nsv" placeholder="Nom du servant" style="flex:1"><button class="p" data-addsv>Ajouter</button></div>
  ${S.servants.length?`<div class="chips">${S.servants.map(n=>`<span class="chip">${esc(n)}<button class="x" data-delsv="${esc(n)}" aria-label="Supprimer">×</button></span>`).join('')}</div>`:'<div class="empty">Ajoutez d’abord vos servants, puis affectez-les dans « Programmation ».</div>'}</div>`;
}
function renderMasses(){

async function saveFile(name,data,type){
  try{const dl=window.claude&&await claude.use('downloads');if(dl){await dl.save({filename:name,data:data.slice(0)});return}}catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function dup(){
  if(!confirm('Remplacer la programmation de cette semaine par celle de la semaine précédente ?'))return;
  const dm=k=>S.masses.some(m=>m.id===k.split('|')[1].split('~')[0]);
  for(let i=0;i<7;i++){
    const kf=fmt(addDays(ws,i-7)),kt=fmt(addDays(ws,i));
    for(const o of ['assign','labels','caps']){
      for(const k of Object.keys(S[o]))if(k.startsWith(kt+'|')&&dm(k))delete S[o][k];
      for(const k of Object.keys(S[o]))if(k.startsWith(kf+'|')&&dm(k))S[o][kt+k.slice(kf.length)]=JSON.parse(JSON.stringify(S[o][k]));
    }
  }
}

const cap1=s=>s.replace(/^./,c=>c.toUpperCase());
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114;return new Date(y,Math.floor(n/31)-1,n%31+1)}
const FEASTS=[
{n:'Sainte Marie, Mère de Dieu',f:[1,1],t:'09:00'},{n:'Mercredi des Cendres',e:-46,t:'19:00'},{n:'Dimanche des Rameaux',e:-7,t:'09:00'},
{n:'Jeudi Saint',e:-3,t:'19:00'},{n:'Vendredi Saint',e:-2,t:'15:00'},{n:'Veillée pascale',e:-1,t:'20:00'},{n:'Pâques',e:0,t:'09:00'},
{n:'Ascension',e:39,t:'09:00'},{n:'Pentecôte',e:49,t:'09:00'},{n:'Fête de saint Marc',f:[4,25],t:'09:00'},
{n:'Assomption',f:[8,15],t:'09:00'},{n:'Toussaint',f:[11,1],t:'09:00'},{n:'Commémoration des défunts',f:[11,2],t:'18:00'},
{n:'Immaculée Conception',f:[12,8],t:'18:00'},{n:'Veillée de Noël',f:[12,24],t:'22:00'},{n:'Noël',f:[12,25],t:'09:00'}];
const today0=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const dtime=(d,t)=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),+t.slice(0,2),+t.slice(3,5));
const occ=(f,y)=>f.f?new Date(y,f.f[0]-1,f.f[1]):addDays(easter(y),f.e);
function upcoming(){
  const t0=today0(),y=t0.getFullYear(),L=[];
  FEASTS.forEach(f=>{for(const yy of [y,y+1]){const d=occ(f,yy);if(d>=t0){L.push({n:f.n,d,t:f.t});break}}});
  (S.fixed||[]).forEach(f=>{const b=pd(f.date);if(f.yearly){for(const yy of [y,y+1]){const d=new Date(yy,b.getMonth(),b.getDate());if(d>=t0){L.push({n:f.n,d,t:f.t,id:f.id});break}}}else if(b>=t0)L.push({n:f.n,d:b,t:f.t,id:f.id})});
  return L.sort((a,b)=>dtime(a.d,a.t)-dtime(b.d,b.t));

function fday(d){
  const k=fmt(d),y=d.getFullYear(),r=[];
  FEASTS.forEach(f=>{if(fmt(occ(f,y))===k)r.push(f.n)});
  (S.fixed||[]).forEach(f=>{const b=pd(f.date);if(f.yearly?(b.getMonth()===d.getMonth()&&b.getDate()===d.getDate()):f.date===k)r.push(f.n)});

const rel=d=>{const n=Math.round((d-today0())/864e5);return n===0?'Aujourd’hui':n===1?'Demain':'J-'+n};
function cdText(ms,lg){if(ms<=0)return 'Aujourd’hui';const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);return lg?`${d} j ${pad(h)} h ${pad(m)} min ${pad(s)} s`:`${d} j ${pad(h)}:${pad(m)}:${pad(s)}`}

let sb=null,online=false,lastFlat={},pushT=null;
const GLOB=['servants','masses','fixed'];
function setStatus(s){const e=document.getElementById('st'),M={local:['Mode local (non partagé)','var(--mut)'],on:['Synchronisé','#2e8b57'],sync:['Synchronisation…','var(--pri)'],err:['Erreur de synchronisation','#c0392b']}[s];e.textContent=s==='local'?'':'● '+M[0];e.style.color=M[1]}
function flat(){const o={masses:S.masses,fixed:S.fixed||[]};S.servants.forEach(n=>{o['servant:'+n]=1});for(const n of ['assign','labels','caps'])for(const k in S[n])o[n+':'+k]=S[n][k];for(const k in S.specials)if(S.specials[k].length)o['specials:'+k]=S.specials[k];return o}
function unflat(o){const s={servants:[...(o.servants||[])],masses:o.masses||DEF().masses,fixed:o.fixed||[],specials:{},assign:{},labels:{},caps:{}};for(const k in o){if(k.startsWith('servant:')){s.servants.push(k.slice(8));continue}const i=k.indexOf(':');if(i>0&&s[k.slice(0,i)])s[k.slice(0,i)][k.slice(i+1)]=o[k]}s.servants=[...new Set(s.servants)].sort((a,b)=>a.localeCompare(b,'fr'));return s}
const snap=o=>{const r={};for(const k in o)r[k]=JSON.stringify(o[k]);return r};
function setKey(k,v){if(k.startsWith('servant:')){const n=k.slice(8);if(!S.servants.includes(n)){S.servants.push(n);S.servants.sort((a,b)=>a.localeCompare(b,'fr'))}return}if(GLOB.includes(k))S[k]=v;else{const i=k.indexOf(':');(S[k.slice(0,i)]=S[k.slice(0,i)]||{})[k.slice(i+1)]=v}}
function delKey(k){if(k.startsWith('servant:'))S.servants=S.servants.filter(x=>x!==k.slice(8));else if(k==='masses')S.masses=DEF().masses;else if(k==='fixed')S.fixed=[];else{const i=k.indexOf(':');if(S[k.slice(0,i)])delete S[k.slice(0,i)][k.slice(i+1)]}}
function syncSoon(){if(!online)return;clearTimeout(pushT);pushT=setTimeout(push,500)}
async function push(){
  pushT=null;const cur=flat(),s=snap(cur),up=[],del=[];
  for(const k in s)if(s[k]!==lastFlat[k])up.push({key:k,value:cur[k],updated_at:new Date().toISOString()});
  for(const k in lastFlat)if(!(k in s))del.push(k);
  if(!up.length&&!del.length)return;
  setStatus('sync');
  const r1=up.length?await sb.from('kv').upsert(up):{},r2=del.length?await sb.from('kv').delete().in('key',del):{};
  if(r1.error||r2.error){setStatus('err');return}
  lastFlat=s;setStatus('on');
}
async function startSync(){
  const {data,error}=await sb.from('kv').select('key,value');
  if(error){setStatus('err');return}
  document.getElementById('login').hidden=true;document.getElementById('btnout').hidden=false;
  if(!data.length){online=true;lastFlat={};try{localStorage.setItem(KEY+'-synced','1')}catch(e){}await push()}
  else{const o={};data.forEach(r=>{o[r.key]=r.value});lastFlat=snap(o);let first=false;try{first=!localStorage.getItem(KEY+'-synced')}catch(e){}if(first){const l=flat();for(const k in l)if(!(k in o))o[k]=l[k]}S=unflat(o);try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KEY+'-synced','1')}catch(e){}online=true;setStatus('on');render();if(first)await push()}
  sb.channel('kv-live').on('postgres_changes',{event:'*',schema:'public',table:'kv'},ev=>{
    const del=ev.eventType==='DELETE',o=del?ev.old:ev.new;if(!o||!o.key)return;
    if(del){if(!(o.key in lastFlat))return;delete lastFlat[o.key];delKey(o.key)}
    else{const j=JSON.stringify(o.value);if(lastFlat[o.key]===j)return;lastFlat[o.key]=j;setKey(o.key,o.value)}
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    const a=document.activeElement;if(!(a&&a.tagName==='INPUT'))render();
  }).subscribe();
}

function pdf(from,to,title){
  if(!window.jspdf){alert('Le module PDF n’a pas pu se charger. Vérifiez votre connexion.');return}
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4',orientation:'landscape'});
  try{doc.addImage(LOGO,'PNG',14,10,20,20)}catch(e){}
  doc.setFont('times','bold');doc.setFontSize(17);doc.setTextColor(122,62,18);
  doc.text('Tableau de service des servants de messe',40,17);
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(60);
  doc.text('Paroisse Saint Marc des Toits-Rouges',40,23);
  doc.text(title,40,28);
  const body=[];
  for(let i=0;i<=Math.round((to-from)/864e5);i++){
    const d=addDays(from,i),sv=services(d);if(!sv.length)continue;
    const day=long(d).replace(/^./,c=>c.toUpperCase());
    sv.forEach((s,j)=>{
      const row=[hm(s.time),s.label,...(s.pos?POSTES.map(p=>get(s.key,p[0]).join('\n')||'—'):[{content:Object.values(S.assign[s.key]||{}).flat().join(', ')||'—',colSpan:POSTES.length}])];
      if(j===0)row.unshift({content:day,rowSpan:sv.length,styles:{fontStyle:'bold',valign:'middle'}});
      body.push(row);
    });
  }
  doc.autoTable({startY:36,head:[['Jour','Heure','Messe',...POSTES.map(p=>p[1])]],body,theme:'grid',
    headStyles:{fillColor:[122,62,18]},styles:{fontSize:9.5,cellPadding:2.5},columnStyles:{0:{cellWidth:32},1:{cellWidth:16},2:{cellWidth:38}},
    didDrawPage:()=>{doc.setFontSize(8);doc.setTextColor(120);doc.text('Liturgieconnecté',14,200)}});
  saveFile('tableau-de-service-'+fmt(from)+'.pdf',doc.output('arraybuffer'),'application/pdf');
}
